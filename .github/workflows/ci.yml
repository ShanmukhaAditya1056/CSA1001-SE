name: DevTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test, & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack_local_password
          POSTGRES_DB: devtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high || true

      - name: Execute Automated Test Suite (Unit, Security, E2E Lifecycle)
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Docker Container Build
        run: docker build -t devtrack:ci .
