# DevTrack API — Deployment (2 replicas) + NodePort Service
# Requires the "devtrack-secrets" Secret (see k8s/README.md, step 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtrack-api
  labels:
    app: devtrack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devtrack-api
  template:
    metadata:
      labels:
        app: devtrack-api
    spec:
      containers:
        - name: devtrack-api
          image: devtrack-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devtrack-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://devtrack:$(POSTGRES_PASSWORD)@devtrack-postgres:5432/devtrack?schema=public"
            # The server refuses to start in production without JWT_SECRET.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devtrack-secrets
                  key: JWT_SECRET
            - name: INVITE_SECRET
              valueFrom:
                secretKeyRef:
                  name: devtrack-secrets
                  key: INVITE_SECRET
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devtrack-api-service
spec:
  type: NodePort
  # Sessions live in each pod's memory, so keep a client on the same replica.
  sessionAffinity: ClientIP
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30080
  selector:
    app: devtrack-api
