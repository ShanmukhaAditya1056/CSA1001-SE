<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>DevTrack — Software Engineering Lifecycle Platform</title>
  <meta name="description" content="DevTrack: Full-stack Software Engineering Lifecycle Management Platform. Manage requirements, tasks, sprints, tests, bugs, and releases in one place." />
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    :root { color-scheme: dark;
      --c-primary-fixed: 225 224 255;
      --c-primary: 192 193 255;
      --c-surface-panel: 30 41 59;
      --c-status-release: 168 85 247;
      --c-surface-base: 11 15 25;
      --c-tertiary: 221 183 255;
      --c-on-secondary: 0 53 74;
      --c-secondary: 123 208 255;
      --c-status-defect: 244 63 94;
      --c-surface-elevated: 51 65 85;
      --c-primary-container: 128 131 255;
      --c-status-passed: 16 185 129;
      --c-text-muted: 100 116 139;
      --c-on-primary: 16 0 169;
      --c-text-secondary: 148 163 184;
      --c-status-in-progress: 245 158 11;
      --c-on-error: 105 0 5;
      --c-text-primary: 248 250 252;
      --c-surface-canvas: 15 23 42;
      --c-on-primary-container: 13 0 150;
      --c-border-strong: 148 163 184; --a-border-strong: 0.28;
      --c-status-defect-surface: 244 63 94; --a-status-defect-surface: 0.12;
      --c-border-subtle: 148 163 184; --a-border-subtle: 0.12;
      --c-status-in-progress-surface: 245 158 11; --a-status-in-progress-surface: 0.12;
      --c-status-passed-surface: 16 185 129; --a-status-passed-surface: 0.12;
      --c-status-release-surface: 168 85 247; --a-status-release-surface: 0.12;
    }
    :root[data-theme="light"] { color-scheme: light;
      --c-primary-fixed: 67 56 202;
      --c-primary: 79 70 229;
      --c-surface-panel: 233 238 245;
      --c-status-release: 147 51 234;
      --c-surface-base: 244 246 251;
      --c-tertiary: 126 34 206;
      --c-on-secondary: 255 255 255;
      --c-secondary: 2 132 199;
      --c-status-defect: 225 29 72;
      --c-surface-elevated: 226 232 240;
      --c-primary-container: 99 102 241;
      --c-status-passed: 5 150 105;
      --c-text-muted: 100 116 139;
      --c-on-primary: 255 255 255;
      --c-text-secondary: 71 85 105;
      --c-status-in-progress: 217 119 6;
      --c-on-error: 255 255 255;
      --c-text-primary: 15 23 42;
      --c-surface-canvas: 255 255 255;
      --c-on-primary-container: 255 255 255;
      --c-border-strong: 100 116 139; --a-border-strong: 0.38;
      --c-status-defect-surface: 225 29 72; --a-status-defect-surface: 0.10;
      --c-border-subtle: 100 116 139; --a-border-subtle: 0.20;
      --c-status-in-progress-surface: 217 119 6; --a-status-in-progress-surface: 0.12;
      --c-status-passed-surface: 5 150 105; --a-status-passed-surface: 0.10;
      --c-status-release-surface: 147 51 234; --a-status-release-surface: 0.10;
    }
  </style>
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var theme = 'dark';
      try { if (localStorage.getItem('devtrack_theme') === 'light') theme = 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Theme colours are CSS variables (see the <style> below) so light/dark can
    // switch at runtime. Translucent tokens keep their base alpha when used
    // bare and take an explicit alpha from opacity modifiers such as /50.
    function translucent(name) {
      return function ({ opacityValue }) {
        var explicit = /^[0-9.]+$/.test(String(opacityValue)) && String(opacityValue) !== '1';
        return 'rgb(var(--c-' + name + ') / ' + (explicit ? opacityValue : 'var(--a-' + name + ')') + ')';
      };
    }
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-background": "#dae2fd",
            "primary-fixed": "rgb(var(--c-primary-fixed) / <alpha-value>)",
            "primary": "rgb(var(--c-primary) / <alpha-value>)",
            "surface-panel": "rgb(var(--c-surface-panel) / <alpha-value>)",
            "tertiary-fixed-dim": "#ddb7ff",
            "status-release": "rgb(var(--c-status-release) / <alpha-value>)",
            "on-tertiary": "#490080",
            "inverse-primary": "#494bd6",
            "surface-base": "rgb(var(--c-surface-base) / <alpha-value>)",
            "border-strong": translucent("border-strong"),
            "error": "#ffb4ab",
            "tertiary": "rgb(var(--c-tertiary) / <alpha-value>)",
            "on-surface-variant": "#c7c4d7",
            "on-secondary": "rgb(var(--c-on-secondary) / <alpha-value>)",
            "surface-container-lowest": "#060e20",
            "surface-tint": "#c0c1ff",
            "surface-dim": "#0b1326",
            "secondary-container": "#00a6e0",
            "surface-bright": "#31394d",
            "secondary": "rgb(var(--c-secondary) / <alpha-value>)",
            "status-defect": "rgb(var(--c-status-defect) / <alpha-value>)",
            "on-secondary-fixed-variant": "#004c69",
            "surface-elevated": "rgb(var(--c-surface-elevated) / <alpha-value>)",
            "surface-container": "#171f33",
            "primary-container": "rgb(var(--c-primary-container) / <alpha-value>)",
            "outline-variant": "#464554",
            "tertiary-container": "#b76dff",
            "on-surface": "#dae2fd",
            "secondary-fixed-dim": "#7bd0ff",
            "secondary-fixed": "#c4e7ff",
            "inverse-surface": "#dae2fd",
            "status-defect-surface": translucent("status-defect-surface"),
            "border-subtle": translucent("border-subtle"),
            "status-passed": "rgb(var(--c-status-passed) / <alpha-value>)",
            "text-muted": "rgb(var(--c-text-muted) / <alpha-value>)",
            "outline": "#908fa0",
            "status-in-progress-surface": translucent("status-in-progress-surface"),
            "surface-container-highest": "#2d3449",
            "background": "#0b1326",
            "tertiary-fixed": "#f0dbff",
            "on-error-container": "#ffdad6",
            "inverse-on-surface": "#283044",
            "surface": "#0b1326",
            "on-tertiary-container": "#400071",
            "on-tertiary-fixed-variant": "#6900b3",
            "on-secondary-container": "#00374d",
            "status-passed-surface": translucent("status-passed-surface"),
            "on-primary-fixed-variant": "#2f2ebe",
            "on-primary": "rgb(var(--c-on-primary) / <alpha-value>)",
            "surface-variant": "#2d3449",
            "status-release-surface": translucent("status-release-surface"),
            "text-secondary": "rgb(var(--c-text-secondary) / <alpha-value>)",
            "status-in-progress": "rgb(var(--c-status-in-progress) / <alpha-value>)",
            "primary-fixed-dim": "#c0c1ff",
            "on-error": "rgb(var(--c-on-error) / <alpha-value>)",
            "on-secondary-fixed": "#001e2c",
            "surface-container-high": "#222a3d",
            "on-tertiary-fixed": "#2c0051",
            "text-primary": "rgb(var(--c-text-primary) / <alpha-value>)",
            "error-container": "#93000a",
            "surface-container-low": "#131b2e",
            "surface-canvas": "rgb(var(--c-surface-canvas) / <alpha-value>)",
            "on-primary-fixed": "#07006c",
            "on-primary-container": "rgb(var(--c-on-primary-container) / <alpha-value>)"
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            lg: "0.25rem",
            xl: "0.5rem",
            "2xl": "0.75rem",
            full: "9999px"
          },
          spacing: {
            "space-xxs": "0.125rem",
            "margin-desktop": "1.5rem",
            "space-xs": "0.25rem",
            "space-xl": "1.5rem",
            "space-sm": "0.5rem",
            "space-3xl": "3rem",
            "margin": "1rem",
            "space-lg": "1rem",
            "space-md": "0.75rem",
            "space-2xl": "2rem",
            "gutter-desktop": "1.5rem",
            "gutter": "1rem"
          },
          fontFamily: {
            "geist": ["Geist", "sans-serif"],
            "inter": ["Inter", "sans-serif"],
            "jetbrains": ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            "mono-lg": ["13px", { lineHeight: "20px", fontWeight: "500" }],
            "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.025em", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }],
            "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
            "headline-sm": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-md": ["13px", { lineHeight: "20px", fontWeight: "400" }],
            "mono-md": ["11px", { lineHeight: "16px", fontWeight: "500" }],
            "body-lg": ["15px", { lineHeight: "24px", fontWeight: "400" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "600" }],
            "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="bg-surface-base font-inter text-body-md text-text-primary antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
  <!-- Grid background overlay -->
  <div class="fixed inset-0 pointer-events-none bg-[linear-gradient(to_right,rgba(148,163,184,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(148,163,184,0.03)_1px,transparent_1px)] bg-[size:32px_32px]"></div>
  
  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>
  
  <!-- Modal backdrop -->
  <div id="modal-backdrop" class="fixed inset-0 z-[90] bg-surface-base/75 backdrop-blur-sm hidden"></div>
  <div id="modal-container" class="fixed inset-0 z-[91] flex items-center justify-center hidden"></div>

  <!-- App root -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col"></div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
